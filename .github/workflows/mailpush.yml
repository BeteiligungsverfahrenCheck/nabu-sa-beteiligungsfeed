name: Beteiligungsportal-Mailpush

on:
  schedule:
    # Einmal pro Werktag morgens (06:30 UTC = 08:30 Berlin im Sommer,
    # 07:30 im Winter). Mehrmals pro Tag macht selten Sinn, weil das
    # Portal nicht stuendlich aktualisiert wird.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:  # manuelles Ausloesen ueber die GitHub-UI

permissions:
  contents: write   # damit state/seen.json zurueck committed werden kann

# Sicherheitsnetz: falls eine der unten verwendeten Actions doch noch
# auf Node 20 fallen sollte, erzwingt diese Env-Variable den Lauf auf
# Node 24. Damit ist der Workflow gegen die Node-Deprecation immun.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Netzwerk-Diagnose (Portal erreichbar?)
        continue-on-error: true
        run: |
          set -e
          echo "--- DNS-Aufloesung ---"
          getent hosts beteiligung.sachsen-anhalt.de || echo "DNS-Lookup fehlgeschlagen"
          echo ""
          echo "--- HTTP-HEAD-Request (10s Timeout) ---"
          curl -sS -I --max-time 10 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            https://beteiligung.sachsen-anhalt.de/portal/hauptportal/beteiligung/themen \
            || echo "(curl-Exitcode oben beachten)"
          echo ""
          echo "--- Eigene IP ---"
          curl -sS --max-time 10 https://api.ipify.org || true
          echo ""

      - name: Scraper ausfuehren und ggf. Mail verschicken
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:  ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS:   ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL:   ${{ secrets.SMTP_USE_SSL }}
          SMTP_FROM:      ${{ secrets.SMTP_FROM }}
          MAIL_TO:        ${{ secrets.MAIL_TO }}
          MAIL_REPLY_TO:  ${{ secrets.MAIL_REPLY_TO }}
        run: python scraper.py --debug

      - name: Debug-HTML als Artefakt sichern (nur bei Bedarf)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-dump
          path: debug_dump.html
          retention-days: 7
          if-no-files-found: ignore

      - name: State zurueck ins Repo committen
        run: |
          git config user.name  "feedbot"
          git config user.email "feedbot@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen am State."
          else
            git commit -m "State aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
